name: Validasi klaim

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ambil nama base branch
        id: base
        run: echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
      # Validator dijalankan dari versi base, bukan versi yang dibawa PR, supaya
      # pembuka PR tidak bisa mengubah aturan validasi lewat PR-nya sendiri.
      - name: Ambil validator versi base
        run: git show "${{ steps.base.outputs.sha }}:scripts/validate.mjs" > /tmp/validate.mjs
      # Seluruh langkah validasi digabung dalam satu langkah dengan sengaja.
      #
      # GitHub menampilkan tombol "Approve and run workflows" untuk PR dari
      # kontributor baru selama belum ada job yang selesai sukses pada commit itu.
      # Selama dipecah per langkah, tombolnya tetap muncul dan PR terlihat
      # menggantung sampai pemilik repo menekannya sendiri.
      - name: Validasi, komentar, lalu tutup bila gagal
        id: val
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOMOR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          node /tmp/validate.mjs "${{ steps.base.outputs.sha }}" 2>&1 | tee validate.log
          LULUS=${PIPESTATUS[0]}

          if [ "$LULUS" -eq 0 ]; then
            BADAN="Semua berkas klaim lolos validasi. Pull request ini akan di-merge otomatis."
          else
            BADAN="Ada yang perlu diperbaiki. Perbaiki berkasnya di pull request ini, tidak perlu menutup dan membuka ulang."
          fi

          # gh dipakai, bukan github-script: di sini github-script pernah gagal
          # dengan "Resource not accessible by integration" saat menandai centang.
          {
            printf '%s\n\n```\n' "$BADAN"
            head -c 60000 validate.log
            printf '\n```\n'
          } > /tmp/komentar.md
          gh pr comment "$NOMOR" --repo "$REPO" --body-file /tmp/komentar.md

          if [ "$LULUS" -ne 0 ]; then
            gh pr close "$NOMOR" --repo "$REPO"
            exit 1
          fi
